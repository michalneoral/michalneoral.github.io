<dl class="wp-caption align{{ include.align }}" style="max-width: {{ include.width }}px">
<dt>{% if include.href %}<a href="{{ site.baseurl }}{{ include.href }}"><img src="{{ site.baseurl }}{{ include.url }}" alt="{{ include.caption | default: include.alt }}" /></a>{% else %}<img src="{{ site.baseurl }}{{ include.url }}" alt="{{ include.caption | default: include.alt }}" />{% endif %}</dt>
{%- if include.caption %}
<dd>{{ include.caption }}</dd>
{%- endif %}
</dl>
